machine:
  whisper_backend: whisper_cpp        # whisper_cpp | faster_whisper
  whisper_model: large-v3-turbo-q5_0
  video_encoder: h264_videotoolbox    # h264_videotoolbox | h264_qsv | libx264
  data_dir: ./data
  min_free_gb: 5                      # stop before downloading/rendering if less disk is free

render:
  caption_font: Montserrat Black      # bundled in assets/fonts (OFL)
  caption_font_size: 90               # em height in px at 1080 wide
  hook_style: titlecard               # titlecard (bar at the top, whole clip) | outline | box
  hook_font: Montserrat SemiBold      # titlecard text, bundled in assets/fonts (OFL)

pipeline:
  videos_per_night: 2
  max_source_minutes: 120             # longer videos are skipped (status skipped_too_long)
  max_retries: 3                      # failed videos/clips are retried on this many later runs
  candidates_per_video: 5
  clip_min_sec: 18
  clip_max_sec: 35
  clip_story_max_sec: 45              # only when Claude marks the clip "story": true
  clip_target_min_sec: 20             # the prompt asks Claude to prefer 20-30 s
  clip_target_max_sec: 30

telegram:                             # clip inbox (PLAN.md §14); token in Keychain, never here
  enabled: false
  chat_id: null                       # set by `python -m clipper.telegram link`
  keychain_service: clipper-telegram  # security add-generic-password -s clipper-telegram -a bot -w <token>
  max_per_run: 10
  delete_local_after_send: true       # keep jpg + json, drop the mp4 once Telegram has it
  delete_after_done_hours: 24         # then delete the video message from the chat

claude:
  keychain_service: clipper-claude-oauth  # `claude setup-token` token; run_nightly.sh exports it
  model: sonnet          # sonnet | haiku
  max_turns: 3
  timeout_sec: 300

campaigns:
  - id: example-podcast
    name: "Example Podcast"
    rate_per_1k: 1.0
    platforms: [youtube_shorts, instagram_reels]
    sources:
      - https://www.youtube.com/@example/videos
    rules:
      min_sec: 15
      max_sec: 60
      required_caption_text: ""
      notes: "No watermarks."
    vocabulary: []                    # names/jargon primed into whisper, e.g. [TJR, PnL]
    caption_fixes: {}                 # misheard -> correct in captions, e.g. {in santos: Insentos}
    active: false
