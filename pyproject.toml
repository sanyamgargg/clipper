[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Local pipeline: campaign long-form video -> vertical short clips"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "yt-dlp",
    "mediapipe",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["clipper*", "review*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
